kind: strategy

id: market_scanner
name: 全市场动量扫描
version: 2.0.0
author: bamy
description: >-
  只做 U 本位永续、只做多、1 倍杠杆。扫描全市场，买"4 小时内暴涨 20%、价格仍贴着高点"的币：
  24h 成交额 ≥ 500 万U 且 24h 涨幅 ≥ 3%，4h 涨幅 ≥ 20% 且距 4h 高点 ≥ -5%；多个同时满足只买成交额最大的一个，
  再等 30 秒做 4 道确认（回落超 0.5%、最近已收盘 1 分钟 K 线是阴线、掉离高点超 5%，任一不过就放弃）。
  排除已下架、上市不满 24 小时、代币化美股/商品和非 USDT 计价的合约。
  出场：亏 6% 立刻卖（最先判断）；涨到过 +4% 后从最高点回落 3% 卖；持满 48 小时卖。
  买入后立刻挂交易所止损单（买入价×0.94），涨过 +4% 后止损单上移到最高价×0.97，程序崩溃或断网也会触发。
  每次用权益的 20%，最多同时持有的币数可调（默认 1 个），同一个币卖掉后 3 小时内不再买。
  暂停、停止、服务退出（重启或部署）都会先把全部持仓平掉，平不掉会写错误日志（交易所上的止损单仍然有效）。
  每轮扫描前先和交易所对账，以交易所为准；对账失败本轮不买新仓。熔断时不买新仓，已有持仓的止损止盈照常。
  注意：这套规则没有做过回测，实盘样本只有 29 笔平仓，硬止损从未真正触发过。买的是已经涨了 20% 的币，
  随时可能是最后一棒，赚的是"继续涨一小段"，亏的是"买在顶部"。请先用模拟盘跑一段时间。
tags: [全市场, 扫描, 动量, 追涨, 移动止盈, 合约]
min_bamy_version: 1.0.0
license: MIT

capabilities:
  close_position: true
  close_positions: true
  close_all: true
  close_partial: false
  cancel_order: false
  cancel_all: false
  list_positions: true
  pause: true
  resume: true
  reset: false

params:
  # ---- 选币 ----
  - key: min_quote_volume
    label: 24h 最低成交额
    type: float
    default: 500
    min: 10
    max: 100000
    suffix: 万U
    help: 24 小时成交额低于这个数的币不看。
    group: 选币

  - key: min_change_24h
    label: 24h 最低涨幅
    type: float
    default: 3
    min: 0
    max: 200
    suffix: "%"
    group: 选币

  - key: window
    label: 统计窗口
    type: select
    default: 4h
    options:
      - { value: 1h, label: 1 小时 }
      - { value: 2h, label: 2 小时 }
      - { value: 4h, label: 4 小时 }
      - { value: 6h, label: 6 小时 }
      - { value: 12h, label: 12 小时 }
    help: 下面"涨幅"和"距高点"按这个窗口算。
    group: 选币

  - key: min_change_pct
    label: 窗口涨幅 ≥
    type: float
    default: 20
    min: 1
    max: 200
    suffix: "%"
    group: 选币

  - key: max_from_high_pct
    label: 距窗口高点 ≥
    type: float
    default: -5
    min: -50
    max: 0
    suffix: "%"
    help: 现价比窗口最高价最多低多少，-5 表示最多低 5%。
    group: 选币

  - key: exclude
    label: 排除币种
    type: string
    default: ""
    max_length: 500
    placeholder: BTC,ETH
    help: 逗号分隔。稳定币已自动排除。
    group: 选币

  # ---- 确认 ----
  - key: confirm_seconds
    label: 确认等待
    type: int
    default: 30
    min: 4
    max: 120
    suffix: 秒
    help: 选中币之后先等这么久再买，躲开瞬间插针。
    group: 确认

  - key: confirm_drop_pct
    label: 等待期回落上限
    type: float
    default: 0.5
    min: 0.1
    max: 5
    suffix: "%"
    help: 等待期间价格比选中时低超过这个比例就放弃。
    group: 确认

  # ---- 资金 ----
  - key: position_pct
    label: 每次投入
    type: percent
    default: 20
    min: 1
    max: 100
    suffix: "% 权益"
    help: 总权益 = 账户余额 + 持仓浮盈。固定 1 倍杠杆。持仓数大于 1 时，建议每次投入不超过 100 ÷ 最大持仓数。
    group: 资金

  - key: slots
    label: 最大持仓数
    type: int
    default: 1
    min: 1
    max: 10
    suffix: 个
    help: 最多同时持有几个币。每轮扫描仍只买成交额最大的一个，空槽会在之后的扫描里逐个补上。
    group: 资金

  - key: adopt_exchange_positions
    label: 补记交易所持仓
    type: bool
    default: true
    help: 对账时交易所有仓、本地没记录就补记并接管止盈止损。账号和别的实例或手动单共用时请关掉，否则会接管不属于本策略的仓位。
    group: 资金

  # ---- 出场 ----
  - key: stop_pct
    label: 止损
    type: float
    default: 6
    min: 0.5
    max: 50
    suffix: "%"
    help: 亏到这个比例立刻卖，永远最先判断。同时作为交易所止损单的价位。
    group: 出场

  - key: arm_pct
    label: 止盈启动
    type: float
    default: 4
    min: 0.5
    max: 100
    suffix: "%"
    help: 浮盈第一次达到这个比例后，才开始跟踪回落，止损单也开始上移。
    group: 出场

  - key: trail_pct
    label: 回落止盈
    type: float
    default: 3
    min: 0.3
    max: 50
    suffix: "%"
    help: 止盈启动后，从最高点回落这么多就卖；交易所止损单跟在最高价的这个比例之下。
    group: 出场

  - key: max_hold_hours
    label: 最长持仓
    type: float
    default: 48
    min: 1
    max: 720
    suffix: 小时
    group: 出场

  - key: cooldown_hours
    label: 同币冷却
    type: float
    default: 3
    min: 0
    max: 168
    suffix: 小时
    help: 同一个币卖掉后，多久内不再买它。
    group: 出场

  # ---- 节奏 ----
  - key: scan_seconds
    label: 全市场扫描间隔
    type: int
    default: 60
    min: 10
    max: 600
    suffix: 秒
    help: 每轮扫描前先对账。
    group: 节奏

  - key: manage_seconds
    label: 持仓检查间隔
    type: int
    default: 15
    min: 5
    max: 120
    suffix: 秒
    group: 节奏

  - key: peak_seconds
    label: 最高价补记间隔
    type: int
    default: 60
    min: 15
    max: 600
    suffix: 秒
    help: 用 1 分钟 K 线补记最高价，防止漏掉两次检查之间的冲高。
    group: 节奏

runtime:
  tick_interval: 5
  market_type: [futures]
  scan: true

suitability:
  capital:
    min_usdt: 50
    sweet_spot_usdt: [200, 50000]
    note: 每次只买一个币，成交额 500 万U 的币在大资金下滑点会很明显；资金大时调高成交额下限。
  market: 牛市、山寨币轮动行情最好；熊市和横盘时会频繁止损
  symbols: U 本位永续（自动排除已下架、新上市、代币化美股/商品、非 USDT 计价和稳定币）
