kind: strategy

id: market_scanner
name: 全市场动量扫描
version: 1.0.0
author: bamy
description: >-
  一个实例扫描币安全部 USDT 交易对，只买"短时间暴涨、而且还贴着高点"的币：
  先按成交额粗筛，再看近 4 小时涨幅和离 4 小时最高价的距离，满足条件才开仓。
  出场：浮盈先摸到 +4%，之后从最高点回撤 3% 止盈；亏到 -4% 止损；最长拿 48 小时。
  同一个币平仓后冷却 3 小时。现货只做多；U 本位合约可以只做多、只做空或双向。
  默认参数就是你给的原规则（4h 涨幅 ≥20%、距 4h 高 ≥-5%、成交额 ≥500 万 U）。
  注意：原规则没有做过回测优化，按我们之前粗测的经验胜率大约 30%，靠少数大涨的单子赚钱，
  连续止损很常见。请先用模拟盘跑一段时间再决定是否上实盘。
tags: [全市场, 扫描, 动量, 追涨, 移动止盈, 现货, 合约]
min_bamy_version: 1.0.0
license: MIT

capabilities:
  close_position: true
  close_positions: true
  close_all: true
  close_partial: false
  cancel_order: false
  cancel_all: false
  list_positions: true
  pause: true
  resume: true
  reset: false

params:
  # ---- 选币 ----
  - key: min_quote_volume
    label: 最低成交额
    type: float
    default: 500
    min: 10
    max: 100000
    suffix: 万U
    help: 24 小时成交额低于这个数的币不看。小币滑点大、容易被操纵，建议不低于 300 万 U。
    group: 选币

  - key: window
    label: 统计窗口
    type: select
    default: 4h
    options:
      - { value: 1h, label: 1 小时 }
      - { value: 2h, label: 2 小时 }
      - { value: 4h, label: 4 小时 }
      - { value: 6h, label: 6 小时 }
      - { value: 12h, label: 12 小时 }
      - { value: 1d, label: 24 小时 }
    help: 下面"涨幅"和"距高点"按这个窗口算。
    group: 选币

  - key: min_change_pct
    label: 窗口涨幅 ≥
    type: float
    default: 20
    min: 1
    max: 200
    suffix: "%"
    help: 窗口内涨幅达到多少才算动量够强。做空时表示跌幅。
    group: 选币

  - key: max_from_high_pct
    label: 距窗口高点 ≥
    type: float
    default: -5
    min: -50
    max: 0
    suffix: "%"
    help: 现价比窗口最高价最多低多少，-5 表示最多低 5%。越接近 0 越"贴着高点"。做空时表示离最低价的距离。
    group: 选币

  - key: direction
    label: 方向
    type: select
    default: long
    options:
      - { value: long, label: 只做多 }
      - { value: short, label: 只做空 }
      - { value: both, label: 双向 }
    help: 只对合约有效，现货永远只做多。
    group: 选币

  - key: exclude
    label: 排除币种
    type: string
    default: ""
    max_length: 500
    placeholder: BTC,ETH
    help: 逗号分隔。稳定币和杠杆代币已自动排除。
    group: 选币

  # ---- 资金 ----
  - key: slots
    label: 同时持仓数
    type: int
    default: 1
    min: 1
    max: 10
    suffix: 个
    help: 最多同时拿几个币。越多越分散，每个币的仓位越小。
    group: 资金

  - key: position_pct
    label: 每仓投入
    type: percent
    default: 95
    min: 1
    max: 100
    suffix: "% 权益"
    help: 每开一个仓用当前权益的百分之几（合约是保证金）。持仓数 >1 时建议设成 100 ÷ 持仓数 以下。
    group: 资金

  - key: leverage
    label: 杠杆
    type: int
    default: 1
    min: 1
    max: 20
    suffix: 倍
    help: 只对合约有效，逐仓。追涨波动大，建议 1–3 倍；风控默认上限 5 倍。
    group: 资金

  # ---- 出场 ----
  - key: stop_pct
    label: 止损
    type: float
    default: 4
    min: 0.5
    max: 50
    suffix: "%"
    help: 亏到这个比例立刻平仓。按价格算，不是按保证金算。
    group: 出场

  - key: arm_pct
    label: 止盈启动
    type: float
    default: 4
    min: 0.5
    max: 100
    suffix: "%"
    help: 浮盈第一次达到这个比例后，才开始跟踪回撤。
    group: 出场

  - key: trail_pct
    label: 回撤止盈
    type: float
    default: 3
    min: 0.3
    max: 50
    suffix: "%"
    help: 止盈启动后，价格从持仓期间最高点回撤这么多就平仓。
    group: 出场

  - key: confirm_ticks
    label: 回撤确认
    type: int
    default: 1
    min: 1
    max: 10
    suffix: 次
    help: 回撤条件连续满足几次（约每秒一次）才平仓，防插针。
    group: 出场

  - key: max_hold_hours
    label: 最长持仓
    type: float
    default: 48
    min: 1
    max: 720
    suffix: 小时
    help: 拿满这么久还没出场就平仓。
    group: 出场

  - key: cooldown_hours
    label: 同币冷却
    type: float
    default: 3
    min: 0
    max: 168
    suffix: 小时
    help: 同一个币平仓后，多久内不再买它。
    group: 出场

  # ---- 其他 ----
  - key: scan_seconds
    label: 扫描间隔
    type: int
    default: 30
    min: 10
    max: 600
    suffix: 秒
    help: 多久扫一次全市场。持仓的止盈止损每秒检查，不受影响。
    group: 其他

runtime:
  tick_interval: 5
  market_type: [spot, futures]
  scan: true

suitability:
  capital:
    min_usdt: 50
    sweet_spot_usdt: [200, 50000]
    note: >-
      全部资金一次压在一个暴涨的小币上，单笔大于几万 U 时，成交额 500 万 U 的币滑点会很明显；
      资金大时把成交额下限调高（例如 5000 万 U）或增加槽位分散。
  market: 牛市、山寨币轮动行情最好；熊市和横盘时会频繁止损
  symbols: 全部 USDT 交易对（自动排除稳定币和杠杆代币）
