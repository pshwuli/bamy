kind: plugin

id: qq_notify
name: QQ 通知
version: 1.3.0
author: bamy
description: >-
  通过 QQ 官方机器人 API v2 把成交、出错、自动停止、风控触发（含合约强平）和系统告警推送到 QQ 私聊或群。
  可在设置页点「扫码绑定」，用手机 QQ 扫码自动创建机器人并回填 AppID、AppSecret 和你的 openid。
  消息用 Markdown 发送，一行一项，内容面向群友：显示策略名而不是编号，买卖方向写成开多、平空等说法。
tags: [notify]
min_bamy_version: 1.0.0
license: MIT

scopes: [user, account, global]
default_scope: user
allow_multiple: false

data_scope: own

priority: 100

network:
  enabled: true
  hosts:
    - bots.qq.com
    - api.sgroup.qq.com
    - q.qq.com
  timeout_ms: 5000

hooks:
  - event: order.filled
    handler: on_filled
  - event: instance.error
    handler: on_error
  - event: instance.auto_stopped
    handler: on_auto_stopped
  - event: risk.breached
    handler: on_risk
  - event: system.alert
    handler: on_alert

actions:
  - id: scan_bind
    label: 扫码绑定
    handler: action_scan_bind

services:
  - id: gateway
    handler: service_gateway

settings:
  - key: app_id
    label: AppID
    type: string
    max_length: 32
    help: 点「扫码绑定」自动填写，也可以手动填 QQ 开放平台里的 AppID
    group: 机器人

  - key: app_secret
    label: AppSecret
    type: secret
    help: 扫码后自动填写，也可以手动填
    group: 机器人

  - key: target_type
    label: 推送目标
    type: select
    default: c2c
    options:
      - { value: c2c, label: 私聊（扫码的人） }
      - { value: group, label: 群 }
    group: 机器人

  - key: user_openid
    label: 用户 openid
    type: string
    max_length: 64
    help: 私聊目标。扫码绑定后自动填写
    group: 机器人

  - key: group_openid
    label: 群 openid
    type: string
    max_length: 64
    help: 推送目标选"群"时填写。不是群号：在群里 @机器人 发送 /id，机器人会回复群 ID
    group: 机器人

  - key: sandbox
    label: 沙箱环境
    type: bool
    default: false
    help: 机器人还在沙箱调试阶段时打开，走 sandbox.api.sgroup.qq.com
    group: 机器人

  - key: min_level
    label: 最低等级
    type: select
    default: info
    options:
      - { value: info, label: 信息 }
      - { value: warn, label: 警告 }
      - { value: error, label: 错误 }
    help: 低于该等级的消息不推送（成交为信息，出错和强平为错误）
    group: 规则

  - key: notify_fills
    label: 推送成交
    type: bool
    default: true
    help: 关掉后只推送出错、停止、风控和告警
    group: 规则

dependencies:
  python: ">=3.11"
  packages:
    - httpx>=0.25.0
    - cryptography>=42.0.0
