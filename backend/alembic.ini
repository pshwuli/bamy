# Alembic 配置。迁移脚本放在包内（bamy/migrations），随代码一起发布。
# 数据库地址不写在这里：env.py 从应用配置（DATABASE_URL）读取。
[alembic]
# %(here)s 是本文件所在目录，这样从仓库根目录或 backend/ 下运行都能找到迁移脚本
script_location = %(here)s/bamy/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
