# BAMY nginx 配置：托管前端静态 + 反代后端
# 挂载到容器 /etc/nginx/nginx.conf（见 docker-compose.yml）
# 上游：app 服务的 8000 端口（compose 内部网络，服务名 app）

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 结构化访问日志（JSON），便于 Loki / ELK 采集（《部署与运行》10.2）
    # 不记录 query string，避免 /ws/*?token=xxx 中的 JWT 落盘（10.7 日志安全）
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log  /var/log/nginx/access.log  json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 10m;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # WebSocket 升级头：有 Upgrade 时置 upgrade，否则 close
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream bamy_app {
        server app:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # 生产应强制 HTTPS（《部署与运行》14.2 / 14.4）：
        # 证书就绪后另起 listen 443 ssl 的 server 块，这里改为 return 301 https://$host$request_uri;
        # 并在 443 server 块中启用 HSTS（只能在 HTTPS 响应里下发，HTTP 下发会被浏览器忽略）：
        #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # 完整 HTTPS 模板见 docker/nginx-https.conf.example

        root   /usr/share/nginx/html;
        index  index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Element Plus 运行时注入内联样式，故 style-src 允许 'unsafe-inline'；脚本只允许同源
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # 公共反代头
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖而不是追加：客户端自带的 X-Forwarded-For 一律丢弃，后端只信任这里写入的真实来源
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        # REST 接口（含 /api/setup、/api/admin、/api/super）
        location /api/ {
            proxy_pass http://bamy_app;
            proxy_read_timeout 60s;
        }

        # WebSocket：/ws/user、/ws/admin、/ws/view/{token}
        location /ws/ {
            proxy_pass http://bamy_app;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }

        # 访客只读分享 /view/{token}（后端按 token 校验，限频由后端负责）
        # 浏览器打开（Accept 含 text/html）→ 前端 SPA 渲染访客页；前端取数据（Accept: application/json）→ 后端
        location /view/ {
            if ($http_accept ~* "text/html") {
                rewrite ^ /index.html last;
            }
            proxy_pass http://bamy_app;
        }

        location = /index.html {
            expires -1;
        }

        # 健康检查
        location = /health {
            proxy_pass http://bamy_app;
            access_log off;
        }

        # Prometheus 指标：只放行内网（《部署与运行》9.4，监控端点不对公网）
        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://bamy_app;
            access_log off;
        }

        # nginx 自身存活探针（容器 HEALTHCHECK 使用，不依赖后端）
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 带 hash 的构建产物长缓存
        location /assets/ {
            # 注意：location 内写 add_header 会丢掉 server 级安全头，所以只用 expires
            expires 30d;
            try_files $uri =404;
        }

        # 前端 SPA：未命中静态文件一律回落 index.html（含 /setup 等前端路由）
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
